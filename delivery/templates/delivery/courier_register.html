{% extends 'customers/base.html' %}

{% block content %}
<div
    style="max-width: 500px; margin: auto; background-color: #f9f9f9; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    <h2
        style="color: #27ae60; text-align: center; border-bottom: 2px solid #27ae60; padding-bottom: 10px; margin-bottom: 20px;">
        تسجيل مندوب جديد</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <div style="text-align: center; margin-top: 20px;">
            <button type="submit"
                style="background-color: #27ae60; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">إضافة
                المندوب</button>
            <a href="{% url 'courier_list' %}" style="margin-right: 15px; color: #7f8c8d; text-decoration: none;">إلغاء
                والعودة</a>
        </div>
    </form>
</div>
{% endblock %}
