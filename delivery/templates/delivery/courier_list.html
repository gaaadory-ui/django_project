{% extends 'customers/base.html' %}

{% block content %}
<h2>قائمة مناديب التوصيل</h2>
<table border="1" style="width:100%; border-collapse: collapse; text-align: left;">
    <tr style="background-color: #2c3e50; color: white;">
        <th style="padding: 10px;">الاسم</th>
        <th style="padding: 10px;">رقم الهاتف</th>
        <th style="padding: 10px;">نوع المركبة</th>
        <th style="padding: 10px;">الإجراءات</th>
    </tr>
    {% for courier in couriers %}
    <tr>
        <td style="padding: 10px;">{{ courier.name }}</td>
        <td style="padding: 10px;">{{ courier.phone }}</td>
        <td style="padding: 10px;">{{ courier.vehicle_type }}</td>
        <td style="padding: 10px;">
            <a href="{% url 'courier_update' courier.id %}">تعديل</a> |
            <a href="{% url 'courier_delete' courier.id %}" style="color: red;">حذف</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="4" style="text-align: center; padding: 20px;">لا يوجد مناديب حالياً.</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
