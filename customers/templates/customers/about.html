{% extends 'customers/base.html' %}

{% block content %}
<div class="card card-info" style="line-height: 1.8;">

    <p style="color: var(--text-main); font-size: 16px;">
        {{ description }}
    </p>
    {% if description %}
    <div style="margin-top: 25px;">
        <span class="badge-dept">نظام البوابة نشط</span>
    </div>
    {% endif %}
</div>
{% endblock %}
