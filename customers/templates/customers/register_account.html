{% extends 'customers/base.html' %}

{% block content %}
<div class="form-container">
    <h2>إنشاء حساب جديد</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-full">إنشاء الحساب (Sign Up)</button>
        </div>

        <div class="form-footer">
            لديك حساب بالفعل؟
            <a href="{% url 'login' %}">سجل دخولك هنا</a>
        </div>
    </form>
</div>
{% endblock %}
