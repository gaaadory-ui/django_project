{% extends 'customers/base.html' %}

{% block content %}
<div class="form-container">
    {% if object %}
    <h2>تعديل بيانات العميل</h2>
    {% else %}
    <h2>تسجيل عميل جديد</h2>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-full">حفظ البيانات</button>
        </div>
        
        <div class="form-footer">
            <a href="{% url 'customer_list' %}">إلغاء والعودة للقائمة</a>
        </div>
    </form>
</div>
{% endblock %}
