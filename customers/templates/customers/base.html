{% load static %}
<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'customers/css/style.css' %}">
</head>

<body>

    <nav>
        <img src="{% static 'customers/images/logo.png' %}" alt="Logo" width="40" style="vertical-align: middle;">

        <a href="{% url 'customers_home' %}">Home</a>
        <a href="{% url 'customers_about' %}">About</a>
        <a href="{% url 'contactus' %}">Contact Us</a>

        {% if user.is_authenticated %}
        <a href="{% url 'register_customer' %}"
            style="background-color: #e67e22; padding: 5px 10px; border-radius: 4px; color: white;">Register</a>
        <a href="{% url 'customer_list' %}">View Customers</a>

        <span style="font-weight: bold; margin-left: 20px; color: #f39c12;">
            Welcome, {{ user.username }}!
        </span>

        <form action="{% url 'logout' %}" method="POST" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="margin-left: 10px; cursor: pointer;">Logout</button>
        </form>

        {% else %}
        <a href="{% url 'login' %}" style="margin-left: 20px;">Login</a>
        <a href="{% url 'register_account' %}">Create Account</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p style="text-align: center; padding: 20px; color: #7f8c8d;">&copy; 2026 Store Portal Project</p>
    </footer>

</body>

</html>
