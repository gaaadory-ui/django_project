{% extends 'customers/base.html' %}

{% block content %}
<div class="delete-container">
    <h2>تأكيد الحذف!</h2>
    
    <p>
        هل أنت متأكد أنك تريد حذف العميل <strong>"{{ customer.first_name }} {{ customer.last_name }}"</strong> بشكل نهائي؟
        <span class="delete-subtext">لا يمكن التراجع عن هذه الخطوة بعد التنفيذ.</span>
    </p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-actions" style="justify-content: center; margin: 0;">
            <button type="submit" class="btn btn-red">نعم، احذف العميل</button>
            <a href="{% url 'customer_list' %}" class="btn btn-secondary">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
