{% extends 'customers/base.html' %}

{% block content %}
<h2>Are you sure?</h2>
<p>You are about to delete the customer: <strong>{{ customer.first_name }} {{ customer.last_name }}</strong>.</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit" style="background-color: red; color: white; padding: 10px;">Yes, Delete Permanently</button>
    <a href="{% url 'customer_list' %}">Cancel</a>
</form>
{% endblock %}
